<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CLF-C02">
<meta name="theme-color" content="#0f1115">
<title>CLF-C02 Final Review</title>
<style>
:root{--bg:#0f1115;--panel:#1a1d24;--panel2:#22262f;--ink:#e9ecf1;--mut:#98a1b0;--rule:#2e3440;
      --acc:#5b9cf8;--ok:#3ecf8e;--no:#f2777a;--warn:#f5c451;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
     -webkit-font-smoothing:antialiased;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;border-radius:12px}

.hdr{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 16px 6px;flex:none}
.hdr .ttl{flex:1;font-size:14px;font-weight:600;color:var(--mut);overflow:hidden;text-overflow:ellipsis;
          white-space:nowrap}
.ib{width:38px;height:36px;display:flex;align-items:center;justify-content:center;font-size:17px;
    color:var(--mut);border-radius:10px;flex:none}
.ib:hover{background:var(--panel)}
.ib.on{color:var(--warn)}
.ib:disabled{opacity:.3}

.segs{display:flex;gap:3px;align-items:center;padding:8px 16px 4px;flex:none}
.segs .sw{flex:1;display:flex;gap:3px;overflow:hidden}
.seg{flex:1;height:3px;border-radius:2px;background:#333a46;min-width:2px}
.seg.done{background:#4a5costume}
.seg.learn{background:var(--ok)}
.seg.cur{background:var(--acc)}
.seg.seen{background:#5a6270}
.segn{font-size:13px;color:var(--mut);flex:none;font-variant-numeric:tabular-nums;padding-left:8px}

main{flex:1;display:flex;flex-direction:column;padding:10px 16px;min-height:0}
.card{flex:1;background:var(--panel);border-radius:26px;padding:30px 26px 22px;display:flex;
      flex-direction:column;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:18px;flex:none}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);
      background:rgba(91,156,248,.13);padding:4px 10px;border-radius:99px}
.chip.g{color:var(--mut);background:var(--panel2)}
.chip.w{color:var(--warn);background:rgba(245,196,81,.13)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.front{font-size:26px;font-weight:600;line-height:1.34;text-align:center}
.front.sm{font-size:21px}
.hint{text-align:center;color:#6b7382;font-size:14px;margin-top:22px;flex:none}
.rule{height:1px;background:var(--rule);margin:20px 0 16px;flex:none}
.back{font-size:17.5px;line-height:1.55;color:#d5dae2}
.back b{color:#fff}
.back ul{margin:9px 0 0;padding-left:19px}
.back li{margin:6px 0}
.shuf{position:absolute;right:22px;bottom:18px;color:#5a6270;font-size:17px;padding:6px}

.mcq{margin:18px 0 0;flex:none}
.pick2{font-size:12.5px;font-weight:700;color:var(--acc);margin:0 0 10px;letter-spacing:.02em;text-align:center}
.mco{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:14px;
     padding:13px 15px;margin:0 0 8px;font-size:16px;line-height:1.35;background:var(--panel2)}
.mco.sel{border-color:var(--acc);background:rgba(91,156,248,.12)}
.mco.ok{border-color:var(--ok);background:rgba(62,207,142,.12)}
.mco.no{border-color:var(--no);background:rgba(242,119,122,.12)}
.mk{flex:none;width:23px;height:23px;border-radius:50%;border:1.5px solid #414958;display:flex;
    align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px;color:var(--mut)}
.mco.sel .mk{border-color:var(--acc);background:var(--acc);color:#0f1115}
.mco.ok .mk{border-color:var(--ok);background:var(--ok);color:#0f1115}
.mco.no .mk{border-color:var(--no);background:var(--no);color:#0f1115}
.verdict{font-size:16px;font-weight:700;margin:0 0 10px}
.v-ok{color:var(--ok)}.v-no{color:var(--no)}

.foot{flex:none;padding:8px 16px calc(env(safe-area-inset-bottom) + 14px)}
.navrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
.nav{width:46px;height:46px;border-radius:50%;background:var(--panel);display:flex;align-items:center;
     justify-content:center;font-size:19px;color:var(--ink)}
.nav:disabled{opacity:.28}
.navn{font-size:14px;color:var(--mut);min-width:74px;text-align:center;font-variant-numeric:tabular-nums}
.big{width:100%;padding:17px;font-size:17px;font-weight:650;background:var(--acc);color:#0b1220;
     border-radius:15px}
.big:disabled{opacity:.35}
.rates{display:flex;gap:9px}
.rates button{flex:1;padding:16px 6px;font-size:16px;font-weight:650;border-radius:14px;line-height:1.15}
.rates .sub{display:block;font-size:10.5px;font-weight:500;opacity:.75;margin-top:3px}
.r1{background:rgba(242,119,122,.16);color:var(--no)}
.r2{background:rgba(91,156,248,.16);color:var(--acc)}
.r3{background:rgba(62,207,142,.16);color:var(--ok)}
.tog{display:flex;align-items:center;justify-content:center;gap:11px;margin-top:12px;font-size:14px;
     color:var(--mut)}
.sw2{width:46px;height:27px;border-radius:99px;background:#333a46;position:relative;flex:none;
     transition:background .18s}
.sw2.on{background:var(--acc)}
.sw2 i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
       transition:transform .18s}
.sw2.on i{transform:translateX(19px)}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 30px}
.pnl{background:var(--panel);border-radius:20px;padding:20px;margin:0 0 14px}
.pnl h2{font-size:17px;margin:0 0 4px}
.pnl p{font-size:14px;color:var(--mut);margin:0 0 14px;line-height:1.5}
.drow{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--rule)}
.drow:first-of-type{border-top:0}
.drow .nm{flex:1;font-size:16px;font-weight:600}
.drow .ct{font-size:13px;color:var(--mut)}
.ghost{width:100%;padding:15px;font-size:16px;font-weight:600;background:var(--panel);margin:0 0 10px}
.item{background:var(--panel);border-radius:15px;padding:14px 16px;margin:0 0 9px}
.item .t{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);
         margin-bottom:6px}
.item .f{font-size:15.5px;font-weight:600;line-height:1.35}
.item .b{font-size:14.5px;line-height:1.5;margin-top:11px;padding-top:11px;border-top:1px solid var(--rule);
         color:#c3cad4}
.item .b ul{margin:7px 0 0;padding-left:18px}
.item .lk{margin-top:11px;font-size:14px;font-weight:650;color:var(--acc)}
.st{float:right;font-size:10px;color:var(--mut);font-weight:600}
.sec{font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);
     margin:20px 0 9px;padding-left:3px}
.ed label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
          color:var(--mut);margin:0 0 6px}
.ed textarea,.ed select{width:100%;border:1px solid var(--rule);border-radius:13px;padding:12px;font:inherit;
       font-size:16px;line-height:1.45;background:var(--panel2);color:var(--ink);resize:vertical}
.ed textarea.f{min-height:88px}.ed textarea.b{min-height:170px}
.ed .row{margin:0 0 15px}
.tip{font-size:12.5px;color:var(--mut);margin:7px 0 0;line-height:1.45}
.ebar{display:flex;gap:9px;margin:0 0 11px}
.ebar button{flex:1;padding:15px 6px;font-size:15.5px;font-weight:650;border-radius:13px;background:var(--panel)}
.ebar .pri{background:var(--acc);color:#0b1220}
.ebar .dan{color:var(--no)}
.gl{background:var(--panel);border-radius:14px;padding:13px 16px;margin:0 0 8px;display:flex;gap:13px;
    align-items:baseline}
.gl .ab{font-weight:700;font-size:15.5px;flex:none;min-width:112px;color:#fff}
.gl .ex{font-size:14.5px;line-height:1.42;color:#c3cad4}
.sum{text-align:center;padding:36px 22px}
.sum .pct{font-size:52px;font-weight:700;line-height:1}
.sum h2{font-size:22px;margin:14px 0 6px}
.sum p{color:var(--mut);font-size:15px;margin:0 0 20px;line-height:1.5}
.bars{text-align:left;margin:18px 0 22px}
.bar{margin:0 0 11px}
.bar .lb{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.bar .lb .v{color:var(--mut)}
.bar .tr{height:7px;background:#2b313c;border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px}

@media(max-width:430px){
  .hdr{padding:calc(env(safe-area-inset-top) + 9px) 12px 4px}
  .segs{padding:7px 12px 3px}main{padding:8px 12px}.scroll{padding:0 12px 26px}
  .card{padding:22px 18px 18px;border-radius:20px}
  .front{font-size:21px}.front.sm{font-size:18px}
  .back{font-size:16px}.meta{margin-bottom:14px}
  .foot{padding:6px 12px calc(env(safe-area-inset-bottom) + 11px)}
  .nav{width:42px;height:42px}
  .rates button{padding:14px 4px;font-size:14.5px}
  .rates .sub{font-size:9.5px}
  .big{padding:15px;font-size:16px}
}
@media(max-height:520px) and (orientation:landscape){
  .front{font-size:19px}.back{font-size:15px}.card{padding:16px 20px}
  .hint{margin-top:12px}.rule{margin:14px 0 11px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =================== DECK ===================
   d=deck  f=front  b=back  o=options  k=correct indices                      */
const C=[

/* ============ DESIGN PRINCIPLES & ARCHITECTURE ============ */
{d:"arch",f:"Name the six general design principles of the AWS Well-Architected Framework.",b:"<b>STAGED</b><ul><li><b>S</b>top guessing your capacity needs</li><li><b>T</b>est systems at production scale</li><li><b>A</b>utomate with architectural experimentation in mind</li><li><b>G</b>ame days — improve through them</li><li><b>E</b>volutionary architectures — consider them</li><li><b>D</b>rive architectures using data</li></ul>"},
{d:"arch",f:"A team spins up a full-size copy of production, load tests it, then deletes it the same day. Which general design principle?",b:"<b>Test systems at production scale.</b><ul><li>You pay only while the environment runs</li><li>Not game days — nothing is failing here</li></ul>",o:["Stop guessing your capacity needs","*Test systems at production scale","Improve through game days","Drive architectures using data"],k:[1]},
{d:"arch",f:"Engineers deliberately terminate instances on a schedule to see how the system responds. Which principle, and which AWS service is built for it?",b:"<b>Improve through game days</b>, using <b>AWS Fault Injection Service (FIS)</b>.<ul><li>Formerly named Fault Injection Simulator — same FIS acronym</li><li>This is chaos engineering</li></ul>",o:["Test at production scale, using CloudFormation","*Improve through game days, using AWS Fault Injection Service","Anticipate failure, using CloudWatch Synthetics","Drive using data, using AWS X-Ray"],k:[1]},
{d:"arch",f:"Which two AWS services are the primary tools for infrastructure as code, and how do they differ?",b:"<b>CloudFormation</b> uses JSON/YAML templates. <b>AWS CDK</b> lets you define infrastructure in a familiar programming language, which it compiles into CloudFormation.<ul><li>Both produce repeatable, version-controlled stacks</li></ul>"},
{d:"arch",f:"Which service is the modern serverless event bus that extends and replaces CloudWatch Events?",b:"<b>Amazon EventBridge.</b><ul><li>Reacts to events from AWS services, SaaS apps, and your own applications</li><li>Routes by rule to targets — it does not sequence steps (that is Step Functions)</li></ul>",o:["Amazon SNS","*Amazon EventBridge","AWS Step Functions","Amazon SQS"],k:[1]},
{d:"arch",f:"Name the four elements of loose coupling in AWS architecture.",b:"<ul><li><b>Well-defined interfaces</b> — components talk only through technology-agnostic APIs such as REST</li><li><b>Service discovery</b> — consume a service without knowing its network topology</li><li><b>Asynchronous integration</b> — an intermediate durable layer (SQS) when no immediate response is needed</li><li><b>Distributed systems best practices</b> — handle component failure gracefully</li></ul>"},
{d:"arch",f:"A component fails and takes the whole application down. Which cloud best practice addresses this, and which two services usually implement it?",b:"<b>Decouple your components</b>, using <b>SQS</b> or <b>SNS</b>.<ul><li>Reinforces service-oriented architecture</li><li>The more loosely coupled, the better it scales</li></ul>",o:["Implement elasticity, using Auto Scaling","*Decouple your components, using SQS or SNS","Think parallel, using AWS Batch","Design for failure, using Multi-AZ"],k:[1]},
{d:"arch",f:"Standby redundancy vs. active redundancy — define each and say which suits a relational database.",b:"<b>Standby:</b> a secondary takes over via failover, with a gap of unavailability. Used for stateful components — <b>this is the relational database pattern (RDS Multi-AZ)</b>.<br><b>Active:</b> requests spread across several resources; if one fails the rest absorb the load."},
{d:"arch",f:"Name the three data replication models and what each trades away.",b:"<ul><li><b>Synchronous</b> — acknowledges only after the write lands on primary and replicas. Protects integrity, costs latency</li><li><b>Asynchronous</b> — decouples replicas, introduces replication lag</li><li><b>Quorum-based</b> — a minimum number of nodes must confirm; blends the two</li></ul>"},
{d:"arch",f:"What is shuffle sharding, and what problem does it solve?",b:"<b>Fault isolation.</b> Customers are assigned overlapping subsets of resources, so one bad workload or failure affects only a small slice rather than everyone.<ul><li>Combines fault isolation with traditional horizontal scaling</li></ul>"},
{d:"arch",f:"Application data caching vs. edge caching — name the service for each.",b:"<b>Application data caching = ElastiCache</b> (in-memory, near your compute).<br><b>Edge caching = CloudFront</b> (content served near the viewer, lowering latency)."},
{d:"arch",f:"Name the five security elements of the AWS design principles.",b:"<ul><li><b>Defense in depth</b> — secure every layer from network to application</li><li><b>Shared responsibility</b> — AWS secures OF the cloud, you secure IN the cloud</li><li><b>Reduce privileged access</b> — least privilege</li><li><b>Security as code</b> — capture firewall rules and hardening in a golden template</li><li><b>Real-time auditing</b> — continuous monitoring and automated controls</li></ul>"},
{d:"arch",f:"Name the four classic cloud architecture best practices (the older whitepaper list, not Well-Architected).",b:"<b>Decouple your components · Think parallel · Implement elasticity · Design for failure.</b><ul><li>Separate from the 6 Well-Architected general principles — do not mix the lists</li></ul>"},
{d:"arch",f:"What is a data lake, and which managed service builds and secures one?",b:"<b>A central store for massive amounts of raw data</b>, ready to be categorised, processed, and analysed by many teams.<ul><li><b>AWS Lake Formation</b> simplifies building, securing, and managing it</li><li>Usually built on S3</li></ul>"},
{d:"arch",f:"Query vs. search — what is the difference, and when do you need a search service?",b:"<b>A query is formal and addressed to precisely structured data. Search works on data that is not precisely structured.</b><ul><li>Search adds ranking, faceting, synonyms, and stemming</li><li>Amazon OpenSearch Service is the AWS answer</li></ul>"},
{d:"arch",f:"Name four database categories and what each is best at.",b:"<ul><li><b>Relational</b> — powerful queries, joins, strong integrity</li><li><b>NoSQL</b> — flexible model, scales horizontally, key-value/document/graph</li><li><b>Data warehouse</b> — specialised relational, optimised for analysis and reporting at volume</li><li><b>Graph</b> — queries over highly connected relationships</li></ul>"},
{d:"arch",f:"Which three services give you the data to drive architecture decisions?",b:"<b>CloudWatch</b> for metrics, <b>CloudTrail</b> for API activity, <b>X-Ray</b> for request tracing.<ul><li>Decide from data, not from feeling</li></ul>"},

/* ============ CLOUD CONCEPTS ============ */
{d:"concept",f:"Traffic triples every Friday evening and drops by Sunday. Which cloud characteristic, and which service implements it?",b:"<b>Elasticity, implemented by EC2 Auto Scaling.</b><ul><li>Elasticity = capacity follows demand, up and down</li><li>Agility = speed of provisioning, the usual distractor</li></ul>",o:["Agility, implemented by CloudFormation","*Elasticity, implemented by EC2 Auto Scaling","High availability, implemented by Multi-AZ","Durability, implemented by S3 versioning"],k:[1]},
{d:"concept",f:"Define elasticity, agility, high availability, and durability in one line each.",b:"<ul><li><b>Elasticity</b> — capacity follows demand</li><li><b>Agility</b> — provision and experiment fast</li><li><b>High availability</b> — stays up when something breaks</li><li><b>Durability</b> — data is not lost</li></ul>"},
{d:"concept",f:"What is the main financial benefit of moving off an owned data centre?",b:"<b>Large upfront capital expenditure becomes variable operational expenditure.</b><ul><li>You stop buying servers and pay for consumption</li><li>AWS never guarantees a smaller bill — reject options promising that</li></ul>",o:["Total spend is guaranteed to fall in year one","*Upfront capital expenditure becomes variable operational expenditure","Hardware depreciation is charged to AWS instead","Capital expenditure rises while operating expenditure falls"],k:[1]},
{d:"concept",f:"Define an AWS Availability Zone.",b:"<b>One or more discrete data centres with redundant power, networking, and connectivity, in separate facilities.</b><ul><li>Region contains multiple AZs</li><li>Edge locations are separate and far more numerous</li></ul>"},
{d:"concept",f:"Which AWS resources are global, which are zonal, and which are regional?",b:"<ul><li><b>Global:</b> IAM, STS, Route 53, CloudFront, WAF</li><li><b>Zonal:</b> EC2 instances, EBS volumes, subnets</li><li><b>Regional:</b> EBS <b>snapshots</b>, EFS, VPC, and everything else</li></ul>",o:["*Amazon EBS volumes are zonal","Amazon EBS snapshots are zonal","*Amazon EC2 instances are zonal","AWS IAM is regional"],k:[0,2]},
{d:"concept",f:"Under the shared responsibility model, which tasks does AWS perform with no customer action?",b:"<b>Hypervisor and everything below.</b><ul><li>Physical security, hardware, host OS, network fabric, media disposal</li><li>You own guest OS, your data, IAM, security groups, encryption choices</li><li>Test: could I click it in the console? Then it is yours</li></ul>",o:["*Patching the EC2 hypervisor","Patching the guest operating system","*Physical security of the data centres","Replicating your data across Availability Zones"],k:[0,2]},
{d:"concept",f:"Horizontal vs. vertical scaling — define each and say which one requires stopping an EC2 instance.",b:"<b>Horizontal = more instances (scale out/in), no downtime — what Auto Scaling does.</b><br><b>Vertical = bigger instance (scale up/down); on EC2 this requires stopping it.</b>"},
{d:"concept",f:"Name the 7 Rs of migration and define rehost, replatform, and repurchase.",b:"<b>Rehost · Replatform · Repurchase · Refactor · Retire · Retain · Relocate.</b><ul><li>Rehost = lift and shift</li><li>Replatform = lift and tinker (EC2 to RDS)</li><li>Repurchase = move to SaaS</li></ul>"},

/* ============ AWS CAF ============ */
{d:"caf",f:"Name the six AWS Cloud Adoption Framework perspectives and what each covers.",b:"<ul><li><b>Business</b> — cloud investment supports business outcomes</li><li><b>People</b> — culture, workforce, the bridge between tech and business</li><li><b>Governance</b> — orchestrate initiatives, maximise benefit, minimise risk</li><li><b>Platform</b> — build and deliver a scalable hybrid environment</li><li><b>Security</b> — confidentiality, integrity, availability</li><li><b>Operations</b> — run services to meet business needs</li></ul>"},
{d:"caf",f:"Which CAF perspective owns each of these roles: CFO, CISO, cloud architects, HR leaders?",b:"<ul><li><b>CFO</b> → Business</li><li><b>CISO</b> → Security</li><li><b>Cloud architects and engineers</b> → Platform</li><li><b>HR leaders</b> → People</li></ul><b>CIO appears in Business, People, and Governance</b>, so it is never the distinctive answer.",o:["*Cloud architects belong to the Platform perspective","The CISO leads the Governance perspective","*The CFO participates in the Business perspective","HR leaders lead the Platform perspective"],k:[0,2]},
{d:"caf",f:"Name the capabilities of the CAF <b>Security</b> perspective.",b:"<ul><li><b>Security governance</b> · <b>Security assurance</b></li><li><b>Identity and access management</b> — who can do what</li><li><b>Threat detection</b> — identify potential threats</li><li><b>Vulnerability management</b> — find and fix weaknesses</li><li><b>Infrastructure protection</b> — harden networks and compute</li><li><b>Data protection</b> — at rest and in transit</li><li><b>Application security</b> · <b>Incident response</b></li></ul>"},
{d:"caf",f:"A company wants to protect applications from unauthorised access and vulnerabilities in the underlying environment. Which CAF Security capability?",b:"<b>Infrastructure Protection.</b><ul><li>Protect the environment → Infrastructure Protection</li><li>Identify a threat → Threat Detection</li><li>Encrypt or classify data → Data Protection</li><li>Control who can act → Identity and Access Management</li></ul>",o:["Identity and Access Management","Threat Detection","*Infrastructure Protection","Data Protection"],k:[2]},
{d:"caf",f:"Which CAF perspective bridges technology and business and prioritises the workforce?",b:"<b>People.</b><ul><li>Culture, leadership, organisational design, training</li><li>Governance is about risk and prioritisation, not people</li></ul>",o:["Governance Perspective","*People Perspective","Operations Perspective","Business Perspective"],k:[1]},
{d:"caf",f:"Name the four phases of the AWS cloud transformation journey.",b:"<b>Envision → Align → Launch → Scale.</b><ul><li><b>Envision</b> — identify outcomes</li><li><b>Align</b> — find gaps across perspectives</li><li><b>Launch</b> — deliver pilots in production</li><li><b>Scale</b> — expand pilots to the desired scale</li></ul>"},
{d:"caf",f:"Name the four CAF transformation domains.",b:"<b>Technology · Process · Organization · Product.</b><ul><li>Technology — migrate and modernise</li><li>Process — digitise and automate operations</li><li>Organization — how teams orchestrate value</li><li>Product — new revenue and business models</li></ul>"},

/* ============ WELL-ARCHITECTED PILLARS ============ */
{d:"wa",f:"Name the six Well-Architected pillars in order, and the key AWS service AWS names for each.",b:"<ul><li><b>Operational Excellence</b> — CloudFormation</li><li><b>Security</b> — IAM</li><li><b>Reliability</b> — CloudWatch</li><li><b>Performance Efficiency</b> — CloudWatch</li><li><b>Cost Optimization</b> — Cost Explorer</li><li><b>Sustainability</b> — EC2 Auto Scaling</li></ul>Sustainability was added in 2021; a list of five is stale."},
{d:"wa",f:"Which pillar stresses selecting the most appropriate and the right number of resource types?",b:"<b>Performance Efficiency.</b><ul><li>Sounds like cost, but the pillar is about fit and efficiency</li><li>Cost Optimization is about removing what you do not need</li></ul>",o:["Cost Optimization","Reliability","*Performance Efficiency","Operational Excellence"],k:[2]},
{d:"wa",f:"Reliability vs. Performance Efficiency vs. Operational Excellence — split them in one line each.",b:"<ul><li><b>Reliability</b> — does it survive and recover</li><li><b>Performance Efficiency</b> — is it the right size and type</li><li><b>Operational Excellence</b> — how you run and improve it</li></ul>"},
{d:"wa",f:"\"Stop guessing capacity\" is a design principle of which pillar?",b:"<b>Reliability.</b><ul><li>Cost Optimization is the usual distractor and is wrong</li><li>It also appears in the 6 general principles, which is why it feels ambiguous</li></ul>",o:["Cost Optimization","*Reliability","Performance Efficiency","Operational Excellence"],k:[1]},
{d:"wa",f:"Which two pillars both list \"use managed services\" as a design principle?",b:"<b>Operational Excellence and Sustainability.</b><ul><li>Reducing operational burden → OpEx</li><li>Reducing environmental footprint → Sustainability</li></ul>",o:["*Operational Excellence","Reliability","*Sustainability","Security"],k:[0,2]},
{d:"wa",f:"Name the seven Security pillar design principles.",b:"<ul><li>Implement a strong identity foundation</li><li><b>Maintain</b> traceability</li><li>Apply security at all layers</li><li>Automate security best practices</li><li>Protect data in transit and at rest</li><li>Keep people away from data</li><li>Prepare for security events</li></ul>AWS says <b>Maintain</b>, not Enable, traceability."},
{d:"wa",f:"Name the five Reliability pillar design principles.",b:"<ul><li>Automatically recover from failure</li><li>Test recovery procedures</li><li>Scale horizontally to increase aggregate availability</li><li>Stop guessing capacity</li><li>Manage change through automation</li></ul>"},
{d:"wa",f:"Framework vs. Well-Architected Tool — how do you tell which one a question means?",b:"<b>Framework = body of knowledge (whitepaper, questions, best practices). Tool = the free console service that reviews a workload and produces an improvement plan.</b>"},
{d:"wa",f:"\"Infrastructure Protection\" appears in which two AWS frameworks, and how do you tell them apart?",b:"<b>Well-Architected Security pillar</b> and the <b>CAF Security perspective</b>.<ul><li>Question says <b>pillar</b> → Well-Architected</li><li>Question says <b>perspective</b> → CAF</li></ul>"},

/* ============ COMPUTE ============ */
{d:"compute",f:"Instances are under-utilised and over-provisioned and the company wants to rightsize with the least operational overhead. Which service?",b:"<b>AWS Compute Optimizer.</b><ul><li>Wrong <b>size</b>, not wrong <b>count</b> — Auto Scaling fixes count</li><li>Savings Plans just make the wrong size cheaper</li><li>ML on CloudWatch metrics; it recommends, you apply</li></ul>",o:["Deploy an Auto Scaling group behind a load balancer","*Use AWS Compute Optimizer and apply its recommendations","Move to EC2 Instance Savings Plans","Buy On-Demand Capacity Reservations"],k:[1]},
{d:"compute",f:"Name Compute Optimizer's three recommendation preferences.",b:"<ol><li><b>Enhanced infrastructure metrics</b> — look-back from 14 days to <b>3 months</b>. The only paid feature</li><li><b>Inferred workload type</b> — effort to move x86 to Graviton</li><li><b>Graviton-based recommendations</b> — price and performance impact</li></ol>"},
{d:"compute",f:"How many Compute Optimizer delegated administrators can an organization have?",b:"<b>Exactly one.</b><ul><li>A member account delegated by the management account</li><li>Can export recommendations, set preferences, set member opt-in</li><li>Register via console or CLI</li></ul>"},
{d:"compute",f:"An instance has been stopped for two weeks with two EBS volumes and an unassociated Elastic IP. What is billed?",b:"<b>Both EBS volumes and the idle Elastic IP.</b><ul><li>No compute charge while stopped</li><li>Idle Elastic IPs bill — Trusted Advisor flags them as waste</li><li>Terminated: root volume deleted by default</li></ul>",o:["Nothing, because the instance is stopped","Both EBS volumes only","*Both EBS volumes and the idle Elastic IP","Instance hours and both EBS volumes"],k:[2]},
{d:"compute",f:"Which purchasing option gives visibility into physical sockets and cores for bring-your-own-license?",b:"<b>Dedicated Hosts.</b><ul><li>Dedicated <i>Instances</i> isolate hardware but expose no socket detail</li><li>Pairs with AWS License Manager for tracking</li></ul>",o:["Dedicated Instances","*Dedicated Hosts","Reserved Instances","On-Demand Capacity Reservations"],k:[1]},
{d:"compute",f:"Which AWS service runs managed Hadoop, Spark, Hive, and Presto clusters for big data processing?",b:"<b>Amazon EMR (Elastic MapReduce).</b><ul><li>For large-scale data processing and transformation</li><li>Glue is serverless ETL; EMR gives you the cluster and frameworks</li></ul>",o:["AWS Glue","*Amazon EMR","Amazon Redshift","AWS Batch"],k:[1]},
{d:"compute",f:"Which is required to build a native iOS application on AWS?",b:"<b>Amazon EC2 Mac instances.</b><ul><li>Compiling iOS requires macOS and Xcode</li><li>Device Farm tests; Amplify hosts back ends</li></ul>",o:["AWS Device Farm","AWS Amplify","*Amazon EC2 Mac instances","AWS App Runner"],k:[2]},
{d:"compute",f:"Which of these is NOT required when launching an EBS-backed EC2 instance: AMI, subnet, Elastic IP, instance type?",b:"<b>Elastic IP is optional.</b><ul><li>Required: AMI, instance type, VPC and subnet, security group, root volume</li><li>A public IPv4 may be auto-assigned by the subnet setting instead</li></ul>",o:["An Amazon Machine Image","A subnet within a VPC","*An Elastic IP address","An instance type"],k:[2]},
{d:"compute",f:"Which two options provide disaster recovery for EC2 in a second Region?",b:"<b>AMIs and EBS snapshots, copied cross-Region.</b><ul><li>RDS snapshots are the trap when the stem restricts scope to EC2</li></ul>",o:["*Amazon Machine Images copied to the second Region","Amazon RDS snapshots","*Amazon EBS snapshots copied to the second Region","AWS Health Dashboard"],k:[0,2]},

/* ============ SERVERLESS, INTEGRATION, APIs ============ */
{d:"srv",f:"Name the core services of the AWS serverless platform — no servers to provision or manage.",b:"<ul><li><b>Compute:</b> Lambda, Fargate</li><li><b>API:</b> API Gateway, AppSync</li><li><b>Storage/data:</b> S3, DynamoDB, Aurora Serverless</li><li><b>Integration:</b> SQS, SNS, EventBridge, Step Functions</li></ul>"},
{d:"srv",f:"Which service lets you create, publish, secure, throttle, and monitor APIs at any scale?",b:"<b>Amazon API Gateway.</b><ul><li>Front door for Lambda, EC2, or any HTTP back end</li><li>Handles authorisation, throttling, caching, and versioning</li><li>Supports REST, HTTP, and WebSocket APIs</li></ul>",o:["AWS AppSync","*Amazon API Gateway","Elastic Load Balancing","Amazon CloudFront"],k:[1]},
{d:"srv",f:"What is CORS, and where do you enable it for a serverless API?",b:"<b>Cross-Origin Resource Sharing — a browser rule that blocks a page on one domain from calling an API on another domain unless the API allows it.</b><ul><li>Enable CORS on the <b>API Gateway</b> resource, or on the <b>S3</b> bucket for cross-domain asset requests</li><li>The fix is a response header, not a firewall change</li></ul>"},
{d:"srv",f:"A browser app on example.com gets blocked calling an API on api.example.net. What is the cause?",b:"<b>CORS is not enabled on the API.</b><ul><li>Not a security group issue — security groups do not see browser origins</li><li>Not IAM — the request never reaches authorisation</li></ul>",o:["A missing inbound security group rule","*CORS is not enabled on the API","An IAM policy denies the caller","The API Gateway stage is not deployed"],k:[1]},
{d:"srv",f:"Which service coordinates multiple AWS services into a serverless workflow with ordering, retries, and state?",b:"<b>AWS Step Functions.</b><ul><li>SQS buffers, SNS fans out, EventBridge routes by rule</li><li>Only Step Functions maintains workflow state</li></ul>",o:["Amazon SQS","AWS Lambda","*AWS Step Functions","Amazon EventBridge"],k:[2]},
{d:"srv",f:"Four integration scenarios: buffer for one consumer, broadcast to many, route by rule, sequence with state. Name the service for each.",b:"<ul><li><b>SQS</b> — buffer, one consumer per message</li><li><b>SNS</b> — fan out to many subscribers</li><li><b>EventBridge</b> — route events by rule</li><li><b>Step Functions</b> — sequence steps with state</li></ul>"},
{d:"srv",f:"What is AWS Glue Studio?",b:"<b>A visual interface inside AWS Glue for building, running, and monitoring ETL jobs by drag and drop.</b><ul><li>Glue is the serverless ETL service and data catalog</li><li>Studio is the no-code/low-code authoring layer on top</li></ul>"},
{d:"srv",f:"Which service runs containers with no servers to provision or manage?",b:"<b>AWS Fargate</b>, used with ECS or EKS.<ul><li>ECS/EKS on the EC2 launch type means you manage the instances</li><li>Fargate has no Reserved Instances — Savings Plans only</li></ul>",o:["Amazon ECS with the EC2 launch type","*AWS Fargate with ECS or EKS","EC2 instances running Docker","AWS Batch on managed EC2"],k:[1]},

/* ============ DATA, DATABASES, ANALYTICS ============ */
{d:"data",f:"Name the AWS database service for each: relational, key-value at scale, MongoDB-compatible, in-memory cache, graph, data warehouse.",b:"<ul><li>Relational → <b>RDS</b>, or <b>Aurora</b> for performance</li><li>Key-value / document at scale → <b>DynamoDB</b></li><li>MongoDB-compatible → <b>DocumentDB</b></li><li>In-memory cache → <b>ElastiCache</b></li><li>Graph → <b>Neptune</b></li><li>Warehouse → <b>Redshift</b></li></ul>"},
{d:"data",f:"Which service stores flexible JSON documents with single-digit millisecond latency at any scale?",b:"<b>Amazon DynamoDB.</b><ul><li>NoSQL key-value and document; schemaless items</li><li>DAX is its in-memory accelerator</li><li>Redshift is columnar for analytics; Neptune is graph</li></ul>",o:["Amazon RDS for PostgreSQL","*Amazon DynamoDB","Amazon Redshift","Amazon Neptune"],k:[1]},
{d:"data",f:"Amazon Aurora — the headline facts?",b:"<b>AWS's MySQL- and PostgreSQL-compatible engine.</b><ul><li>Up to <b>5x</b> MySQL and <b>3x</b> PostgreSQL throughput</li><li><b>Six copies</b> of data across <b>three</b> Availability Zones</li></ul>"},
{d:"data",f:"Which service caches the results of I/O-intensive database queries in memory?",b:"<b>Amazon ElastiCache.</b><ul><li>A read replica still executes the query — the tempting near-miss</li><li>DAX is DynamoDB-specific</li></ul>",o:["An RDS read replica","*Amazon ElastiCache","Amazon DynamoDB Accelerator","Amazon CloudFront"],k:[1]},
{d:"data",f:"Increase read throughput on a read-heavy relational database. Which feature?",b:"<b>RDS read replicas.</b><ul><li><b>Multi-AZ is for availability, not read scaling</b></li><li>Read replicas can be cross-Region</li></ul>",o:["RDS Multi-AZ deployment","*RDS read replicas","Amazon Redshift","A larger instance class"],k:[1]},
{d:"data",f:"Which service builds business intelligence dashboards and visualisations for non-technical users?",b:"<b>Amazon QuickSight.</b><ul><li>Serverless BI; connects to Redshift, RDS, S3, Athena and more</li><li>SPICE is its in-memory calculation engine</li><li>Sits at the end of the analytics pipeline</li></ul>",o:["Amazon OpenSearch Dashboards","*Amazon QuickSight","Amazon Athena","AWS Glue Studio"],k:[1]},
{d:"data",f:"Data arrives as a live stream and must end on a business dashboard. Name the services along that pipeline in order.",b:"<b>Kinesis → Glue → S3 → Athena or Redshift → QuickSight.</b><ul><li>Kinesis ingests, Glue transforms, S3 stores, Athena queries, QuickSight visualises</li><li>EMR sits alongside for heavy Hadoop/Spark processing</li></ul>"},
{d:"data",f:"Which two services query data directly in S3 without loading it first?",b:"<b>Amazon Athena</b> (serverless) and <b>Redshift Spectrum</b> (from a Redshift cluster).",o:["*Amazon Athena","Amazon Neptune","*Amazon Redshift Spectrum","Amazon ElastiCache"],k:[0,2]},
{d:"data",f:"Which service centralises backup across EC2, EBS, RDS, DynamoDB, EFS and more with policy-driven schedules?",b:"<b>AWS Backup.</b><ul><li>Backup plans, retention rules, cross-Region and cross-account copies, vault lock</li><li><b>Elastic Disaster Recovery (DRS)</b> is different — continuous replication for fast failover</li></ul>",o:["AWS Elastic Disaster Recovery","*AWS Backup","Amazon S3 Lifecycle policies","AWS DataSync"],k:[1]},
{d:"data",f:"AWS Backup vs. AWS Elastic Disaster Recovery — when do you pick each?",b:"<b>Backup = scheduled point-in-time copies for restore and compliance.</b><br><b>DRS = continuous replication for minimal downtime and data loss on failover.</b>"},
{d:"data",f:"Name all seven S3 storage classes and the access pattern each targets.",b:"<ul><li><b>Standard</b> — frequent</li><li><b>Standard-IA</b> — infrequent, multi-AZ</li><li><b>One Zone-IA</b> — infrequent, re-creatable, single AZ, cheapest IA</li><li><b>Intelligent-Tiering</b> — unpredictable access</li><li><b>Glacier Instant</b> — archive, milliseconds</li><li><b>Glacier Flexible</b> — minutes to hours</li><li><b>Deep Archive</b> — hours, cheapest</li></ul>"},
{d:"data",f:"Re-creatable secondary backup needing millisecond retrieval, cheapest class?",b:"<b>S3 One Zone-IA.</b><ul><li>Re-creatable is what makes single-AZ risk acceptable</li><li>Low latency rules out every Glacier tier</li></ul>",o:["S3 Standard-IA","*S3 One Zone-IA","S3 Glacier Instant Retrieval","S3 Glacier Deep Archive"],k:[1]},
{d:"data",f:"Which S3 action does NOT incur a charge?",b:"<b>Uploading — data transfer IN is free.</b><ul><li>S3 cost = storage + requests + data transfer <b>OUT</b></li></ul>",o:["*Uploading objects into the bucket","GET requests against objects","Transferring objects out to the internet","Transitioning objects to Glacier"],k:[0]},

/* ============ STORAGE SELECTION ============ */
{d:"storage",f:"A scenario needs storage. What two questions do you ask, in order?",b:"<b>1. Database or files?</b> Database → RDS or DynamoDB.<br><b>2. How many machines at once?</b><ul><li>One → EBS, or Instance Store if throwaway</li><li>Many → EFS (Linux) or FSx for Windows</li></ul>"},
{d:"storage",f:"Fastest disk, temporary block storage attached to the instance?",b:"<b>EC2 Instance Store.</b><ul><li>Physically attached to the host, so lowest latency</li><li>Data lost on stop or terminate</li><li>EBS and EFS are persistent and network-attached</li></ul>",o:["Amazon EBS Provisioned IOPS SSD","Amazon EFS","*EC2 instance store","Amazon EBS gp3"],k:[2]},
{d:"storage",f:"A database holds the only copy of its data and needs consistent low-latency I/O on one instance. Which storage?",b:"<b>Amazon EBS (Provisioned IOPS).</b><ul><li>Instance Store is faster but volatile — fatal for the only copy</li><li>When the stem says \"only copy\" or \"must survive,\" persistence beats speed</li></ul>",o:["EC2 instance store","*Amazon EBS Provisioned IOPS SSD","Amazon EFS","Amazon S3"],k:[1]},
{d:"storage",f:"Many Linux servers need one shared file system with massive parallel access. Which service?",b:"<b>Amazon EFS.</b><ul><li>NFS, thousands of concurrent clients, grows automatically</li><li>S3 is objects — no file semantics or locking</li><li>Storage Gateway is a bridge for one on-prem app, not a fleet file system</li></ul>",o:["Amazon S3","Amazon EBS","*Amazon EFS","AWS Storage Gateway"],k:[2]},
{d:"storage",f:"Multiple EC2 instances need a centralised Windows file server with SMB and Active Directory. Which service?",b:"<b>Amazon FSx for Windows File Server.</b><ul><li><b>EFS is Linux/NFS only</b> — that is the trap</li><li>\"Windows\" beats \"HPC\" and beats \"shared\"</li></ul>",o:["Amazon EFS","*Amazon FSx for Windows File Server","Amazon EBS Multi-Attach","Amazon S3"],k:[1]},
{d:"storage",f:"Upload a single 15 GB object reliably over an unstable connection. Which S3 feature?",b:"<b>Multipart Upload.</b><ul><li>Splits into parts, uploads in parallel, retries parts individually</li><li>Required by AWS above 5 GB</li><li>Transfer Acceleration is about distance, not resumability</li></ul>"},
{d:"storage",f:"Guarantee that no object in a bucket can ever be public, whatever policy someone applies later?",b:"<b>S3 Block Public Access.</b><ul><li>Overrides bucket policies and object ACLs, at bucket or account level</li><li>S3 has no security groups and no network ACLs</li></ul>",o:["A network ACL","*S3 Block Public Access","A VPC gateway endpoint","Server-side encryption with KMS"],k:[1]},
{d:"storage",f:"Require a second authentication factor before an S3 object version can be permanently deleted?",b:"<b>MFA Delete</b> on a versioned bucket.<ul><li>Block Public Access prevents exposure, not deletion</li><li>Object Lock is about retention compliance</li></ul>",o:["S3 Versioning alone","*MFA Delete on a versioned bucket","Block Public Access","Object Lock in governance mode"],k:[1]},

/* ============ NETWORKING ============ */
{d:"net",f:"An app is down and users must be sent to healthy instances. Which two services, and which one is the trap?",b:"<b>Route 53 health checks and Elastic Load Balancing.</b><ul><li><b>Auto Scaling replaces instances but does not reroute traffic</b> — the trap</li><li>VPC route tables have no health awareness</li></ul>",o:["*Elastic Load Balancing","EC2 Auto Scaling","*Amazon Route 53 health checks","VPC route tables"],k:[0,2]},
{d:"net",f:"Instances keep failing and the company wants capacity automatically restored to the desired count. Which service?",b:"<b>EC2 Auto Scaling.</b><ul><li>Reverse of the rerouting question — here Auto Scaling IS correct</li><li>Read the verb: restore capacity vs. redirect traffic</li></ul>",o:["Amazon Route 53 health checks","Elastic Load Balancing","*EC2 Auto Scaling","AWS Systems Manager"],k:[2]},
{d:"net",f:"For each endpoint pair, name the service: office to AWS, one user to AWS, VPC to VPC, many networks to many, private subnet to internet, public subnet to internet.",b:"<ul><li>Office ↔ AWS: <b>Site-to-Site VPN</b> or <b>Direct Connect</b></li><li>User ↔ AWS: <b>Client VPN</b></li><li>VPC ↔ VPC: <b>VPC Peering</b></li><li>Many ↔ many: <b>Transit Gateway</b></li><li>Private → internet: <b>NAT gateway</b></li><li>Public subnet: <b>Internet gateway</b></li></ul>"},
{d:"net",f:"What are the two endpoints of an AWS Site-to-Site VPN?",b:"<b>Virtual private gateway (AWS side) and customer gateway (your side).</b><ul><li>Two tunnels are created for availability</li><li>Route 53 <b>Resolver</b> handles hybrid DNS — a different job</li></ul>",o:["*Virtual private gateway","NAT gateway","*Customer gateway","Internet gateway"],k:[0,2]},
{d:"net",f:"Which service captures IP traffic to and from network interfaces, with ACCEPT and REJECT records?",b:"<b>VPC Flow Logs.</b><ul><li>Works at the ENI, subnet, or VPC level; not real time</li><li>CloudTrail records API calls, not packets</li></ul>",o:["AWS CloudTrail","*VPC Flow Logs","Amazon Inspector","AWS X-Ray"],k:[1]},
{d:"net",f:"Name the two benefits of serving content through CloudFront edge locations.",b:"<b>Lower latency because content sits near the viewer, and reduced load on your origin because responses are cached.</b><ul><li>Distractors are usually other services: Data Transfer Terminal, IoT Greengrass, S3</li></ul>",o:["*Content is delivered closer to users, lowering latency","Automatic encryption of data at the origin","*Caching reduces load on origin servers","Automatic database replication to every Region"],k:[0,2]},
{d:"net",f:"CloudFront vs. Global Accelerator — when do you pick each?",b:"<b>CloudFront caches HTTP/HTTPS content at the edge. Global Accelerator provides static anycast IPs and routes TCP/UDP over the AWS backbone.</b><ul><li>Non-HTTP protocols or static IPs → Global Accelerator</li></ul>"},
{d:"net",f:"Which service connects many VPCs and on-premises networks through one central hub?",b:"<b>AWS Transit Gateway.</b><ul><li>Replaces a mesh of peering connections</li><li>VPC peering is not transitive — that is the problem Transit Gateway solves</li></ul>"},
{d:"net",f:"Which service gives a dedicated private connection with a more consistent network experience than the internet?",b:"<b>AWS Direct Connect.</b><ul><li>Consistent, predictable, dedicated → Direct Connect</li><li>Encrypted over public internet → Site-to-Site VPN</li></ul>"},
{d:"net",f:"What is AWS PrivateLink for?",b:"<b>Private connectivity to AWS or partner services without traversing the internet.</b><ul><li>Traffic stays on the AWS network</li><li>Removes the need for an internet gateway or NAT for that service</li></ul>"},

/* ============ SECURITY ============ */
{d:"sec",f:"Which security group rule would be REJECTED?",b:"<b>Anything naming an instance ID or a hostname.</b><ul><li>Valid: IP, CIDR range, security group ID, prefix list ID</li><li>Inbound takes a <b>source</b>; outbound takes a <b>destination</b></li><li>Allow-only, stateful, no deny rules</li></ul>",o:["Inbound 443 from a prefix list ID","Inbound 80 from ::/0","Outbound 5432 to a security group ID","*Inbound 22 from an EC2 instance ID"],k:[3]},
{d:"sec",f:"A security group has no deny rules. How does it restrict traffic to only one port?",b:"<b>Implicit deny-all.</b><ul><li>Anything not explicitly allowed is already blocked</li><li>\"Exclusive access via a specific port\" is achieved by omission, not by a deny rule</li></ul>"},
{d:"sec",f:"You must block one specific malicious IP while leaving everything else open. Security group or NACL?",b:"<b>Network ACL.</b><ul><li>Security groups are allow-only and cannot express \"allow all except this\"</li><li>NACLs are subnet-level, stateless, and support deny rules in rule-number order</li></ul>",o:["A security group inbound rule","*A network ACL deny rule","AWS WAF","An IAM policy"],k:[1]},
{d:"sec",f:"Contrast security groups and network ACLs on level, statefulness, and rule types.",b:"<ul><li><b>Security group</b> — instance/ENI level, <b>stateful</b>, allow only, all rules evaluated together</li><li><b>Network ACL</b> — subnet level, <b>stateless</b>, allow <b>and</b> deny, evaluated in rule-number order</li></ul>"},
{d:"sec",f:"A three-tier app uses security groups on each instance's network interface. Which task can a security group actually perform?",b:"<b>Allow access to instances in a VPC on a specific port and nothing else.</b><ul><li>Cannot filter at the subnet — that is a NACL</li><li>Cannot protect S3 or CloudFront — neither has security groups</li></ul>",o:["Apply a stateful firewall to an S3 bucket","*Allow access to EC2 instances in a VPC on a specific port only","Block malicious IPs at each tier's subnet","Secure CloudFront cached data"],k:[1]},
{d:"sec",f:"Can AWS customers run penetration tests without prior approval, and on which services?",b:"<b>Yes, without prior approval, on the permitted services list.</b><ul><li>EC2, NAT Gateways, Elastic Load Balancers, RDS, Aurora, CloudFront, API Gateway, Lambda and Lambda@Edge, Lightsail, Elastic Beanstalk</li><li>You may test <b>your own</b> resources only, never AWS infrastructure itself</li></ul>"},
{d:"sec",f:"Which penetration testing activities are prohibited or require prior AWS approval?",b:"<ul><li>DNS zone walking via Route 53 hosted zones</li><li>DoS, DDoS, simulated DoS or DDoS</li><li>Port flooding, protocol flooding, request flooding</li><li><b>Command and Control (C2) testing requires prior approval</b></li></ul>Anything resembling denial of service needs an approval request through Support.",o:["*Simulated DDoS against your own endpoint","Vulnerability scanning your own EC2 instance","*DNS zone walking of a Route 53 hosted zone","Testing your own Lambda function"],k:[0,2]},
{d:"sec",f:"Root account compromised. Which two actions are the priority?",b:"<b>Enable MFA on the root user and configure a strong password policy.</b><ul><li>Then delete root access keys — AWS recommends root have none</li><li>Rotate credentials, apply least privilege</li></ul>",o:["*Enable MFA on the root user","Grant IAM users full administrator access","*Configure a strong password policy","Disable credential rotation"],k:[0,2]},
{d:"sec",f:"IAM user vs. group vs. role — which holds long-term credentials, which only bundles permissions, which is assumed?",b:"<ul><li><b>User</b> — long-term identity: password, access keys, SSH keys</li><li><b>Group</b> — permission bundle only, cannot be assumed, issues no credentials</li><li><b>Role</b> — temporary, assumed, no stored credentials. Best for EC2 and cross-account</li></ul>"},
{d:"sec",f:"Which tool tests what an IAM policy will permit before you attach it?",b:"<b>IAM Policy Simulator.</b><ul><li>Tests identity-based and resource-based policies, including STS access</li><li>Config evaluates deployed resources; CloudTrail records the past</li></ul>"},
{d:"sec",f:"Did it arrive as an HTTP request to my web app? Use that to pick between Shield, WAF, and GuardDuty.",b:"<ul><li>Yes, and it is <b>volume</b> → <b>Shield</b> (DDoS)</li><li>Yes, and it is <b>malicious content</b> (SQLi, XSS) → <b>WAF</b></li><li>No, it is account-level anomaly → <b>GuardDuty</b></li></ul>"},
{d:"sec",f:"GuardDuty, Detective, and Security Hub — what does each do?",b:"<b>GuardDuty detects. Detective investigates why. Security Hub aggregates.</b><ul><li>GuardDuty analyses CloudTrail, VPC Flow Logs, and DNS logs</li><li>Security Hub is the single pane across services and accounts</li></ul>"},
{d:"sec",f:"Macie vs. Inspector — what does each scan?",b:"<b>Macie finds sensitive data (PII) in S3. Inspector finds software vulnerabilities in EC2, containers, and Lambda.</b>"},
{d:"sec",f:"Four scenarios: manage encryption keys, need dedicated key hardware, rotate a database password, issue a TLS certificate. Name each service.",b:"<ul><li><b>KMS</b> — managed keys, the default answer</li><li><b>CloudHSM</b> — dedicated single-tenant hardware</li><li><b>Secrets Manager</b> — store and rotate credentials</li><li><b>ACM</b> — TLS certificates</li></ul>"},
{d:"sec",f:"Where do you download AWS's own SOC and PCI compliance reports?",b:"<b>AWS Artifact.</b><ul><li>Artifact = AWS's compliance paperwork</li><li><b>Audit Manager</b> = build evidence for <i>your</i> audit</li></ul>"},
{d:"sec",f:"Three identity scenarios: your app's consumers, employees across AWS accounts, managed Active Directory. Name each service.",b:"<ul><li><b>Cognito</b> — consumer app users (user pool authenticates, identity pool issues temporary AWS credentials)</li><li><b>IAM Identity Center</b> — workforce SSO across accounts</li><li><b>Directory Service</b> — managed Microsoft AD</li></ul>"},
{d:"sec",f:"Control which services member accounts may use across an organization?",b:"<b>Service Control Policies in AWS Organizations.</b><ul><li>SCPs set the <b>maximum</b> permissions; they never grant permissions</li><li>Control Tower applies guardrails on top of Organizations</li></ul>"},

/* ============ BILLING & SUPPORT ============ */
{d:"bill",f:"Which is the cheapest support plan that includes the AWS Support API for programmatic case management?",b:"<b>Business Support+.</b><ul><li>First paid tier; also brings the full Trusted Advisor check set</li><li>Basic is account and billing only — no technical cases</li></ul>",o:["Basic","*Business Support+","Enterprise Support","Unified Operations"],k:[1]},
{d:"bill",f:"Name the four current AWS Support plans and the business-critical response time of each paid tier.",b:"<b>Basic · Business Support+ · Enterprise · Unified Operations.</b><ul><li>Business Support+ → <b>30 min</b></li><li>Enterprise → <b>15 min</b></li><li>Unified Operations → <b>5 min</b></li></ul>Developer and Enterprise On-Ramp retire January 2027."},
{d:"bill",f:"Give the full Enterprise Support response-time ladder.",b:"<ul><li>General guidance — <b>24 hours</b></li><li>System impaired — <b>12 hours</b></li><li>Production impaired — <b>4 hours</b></li><li>Production down — <b>1 hour</b></li><li>Business-critical down — <b>15 minutes</b></li></ul>",o:["*15 minutes business-critical down","30 minutes business-critical down","*1 hour production down","4 hours production down"],k:[0,2]},
{d:"bill",f:"Which is the lowest support tier including a Technical Account Manager and a dedicated billing specialist?",b:"<b>Enterprise Support.</b><ul><li>Dedicated humans start at Enterprise; tools and APIs start at Business Support+</li><li>The billing specialist was historically the Concierge Support Team</li></ul>"},
{d:"bill",f:"A startup on Basic Support needs free technical help understanding a service's behaviour. Where do they go?",b:"<b>AWS re:Post.</b><ul><li>Free community Q&A with AWS-vetted answers</li><li>Trusted Advisor is in Basic but gives recommendations, not answers</li></ul>",o:["AWS Trusted Advisor","*AWS re:Post","AWS Technical Account Manager","AWS Concierge Support"],k:[1]},
{d:"bill",f:"Which pricing option reduces cost on any EC2 usage regardless of Region, family, size, OS, or tenancy?",b:"<b>Compute Savings Plans.</b><ul><li>Up to 66% off; also covers Lambda and Fargate</li><li>EC2 Instance Savings Plans: up to 72% but locked to one family in one Region</li></ul>",o:["Standard Reserved Instances","EC2 Instance Savings Plans","*Compute Savings Plans","On-Demand Capacity Reservations"],k:[2]},
{d:"bill",f:"Which services have their own Reserved Instance or reserved capacity model?",b:"<b>EC2, RDS, ElastiCache, Redshift, OpenSearch, DynamoDB.</b><ul><li>Not Batch, Beanstalk, EKS, Fargate, or Lambda — those run on EC2 or use Savings Plans</li></ul>",o:["*Amazon ElastiCache","AWS Fargate","*Amazon Redshift","AWS Lambda"],k:[0,2]},
{d:"bill",f:"Standard vs. Convertible Reserved Instance, and which payment option costs least overall?",b:"<b>Standard = deeper discount, cannot change family. Convertible = smaller discount, can change family, OS, or tenancy.</b><ul><li><b>All Upfront</b> beats Partial Upfront beats No Upfront</li></ul>"},
{d:"bill",f:"An interruptible, fault-tolerant batch job. Cheapest purchasing option and how much off?",b:"<b>Spot Instances, up to 90% off On-Demand.</b><ul><li>Interruptible is the trigger word</li><li>If the workload cannot be interrupted, Spot is instantly wrong</li></ul>",o:["Compute Savings Plans","Standard Reserved Instances","*Spot Instances","Dedicated Hosts"],k:[2]},
{d:"bill",f:"Four cost tools: estimate before building, alert on a threshold, analyse past spend, find current waste. Name each.",b:"<ul><li><b>Pricing Calculator</b> — before you build</li><li><b>Budgets</b> — alert, including on <b>forecast</b>; Budget Actions can enforce</li><li><b>Cost Explorer</b> — analyse and forecast past spend</li><li><b>Trusted Advisor</b> — what is wasteful right now</li></ul>"},
{d:"bill",f:"You want an alert before spending actually exceeds a threshold. Which service, and why not CloudWatch?",b:"<b>AWS Budgets — it can alert on forecasted spend.</b><ul><li>CloudWatch billing alarms fire only on charges already incurred, and the metric exists only in us-east-1</li></ul>",o:["A CloudWatch billing alarm","*AWS Budgets","AWS Cost Explorer","AWS Trusted Advisor"],k:[1]},
{d:"bill",f:"Name Trusted Advisor's five check categories and which plans get the full set.",b:"<b>Cost optimization, performance, security, fault tolerance, service limits.</b><ul><li>Basic gets core checks only; Business Support+ gets the full set</li><li>Trusted Advisor <b>Priority</b> requires Enterprise</li></ul>"},
{d:"bill",f:"Trusted Advisor vs. Compute Optimizer — which does what?",b:"<b>Trusted Advisor flags waste and misconfiguration. Compute Optimizer recommends the optimal size and type.</b><ul><li>The word <b>rightsize</b> means Compute Optimizer</li></ul>"},
{d:"bill",f:"Forty accounts, one invoice, combined volume discounts. What enables this?",b:"<b>Consolidated billing through AWS Organizations.</b><ul><li>Usage aggregates so tiered discounts apply to the total</li><li>RIs and Savings Plans can be shared across accounts</li><li><b>Cost allocation tags</b> attribute spend to teams</li></ul>"},

/* ============ MONITORING ============ */
{d:"mon",f:"Three services answer three questions: is it healthy, who changed it, what state is it in. Name each.",b:"<ul><li><b>CloudWatch</b> — metrics, logs, alarms. Is it healthy?</li><li><b>CloudTrail</b> — API activity. <b>Who</b> did it, when, from what IP?</li><li><b>Config</b> — configuration history and compliance. <b>What state</b>, and was it compliant?</li></ul>"},
{d:"mon",f:"An S3 bucket went public. Which service tells you who made it public, and which tells you which buckets are public now?",b:"<b>Who did it = CloudTrail. Which are public now = Config.</b><ul><li>Action vs. state — the single most repeated distinction on this exam</li></ul>",o:["Both questions are answered by CloudTrail","*CloudTrail for who, AWS Config for which","Both are answered by AWS Config","CloudWatch for who, Config for which"],k:[1]},
{d:"mon",f:"An API Gateway + Lambda + DynamoDB app is slow. Which service shows which component adds the latency?",b:"<b>AWS X-Ray.</b><ul><li>Traces one request end to end and produces a service map</li><li>CloudWatch tells you THAT it is slow; X-Ray tells you WHERE</li></ul>",o:["Amazon CloudWatch Alarms","*AWS X-Ray","VPC Flow Logs","AWS CloudTrail"],k:[1]},
{d:"mon",f:"AWS Health Dashboard vs. CloudWatch — what does each report?",b:"<b>Health Dashboard reports AWS's problems affecting your resources. CloudWatch reports your resources' own metrics.</b>"},
{d:"mon",f:"Which service manages a fleet — patching, running commands, storing configuration parameters, shell access without SSH?",b:"<b>AWS Systems Manager.</b><ul><li>Patch Manager, Run Command, Parameter Store, Session Manager</li><li>CloudFormation provisions; Systems Manager operates</li></ul>"},

/* ============ SERVICE IDENTIFICATION ============ */
{d:"svc",f:"Two services for business communication and customer service?",b:"<b>Amazon Chime</b> (employees: meetings, chat) and <b>Amazon Connect</b> (customers: cloud contact centre).<ul><li>Inside vs. outside — split the stem in half</li><li>WorkSpaces is virtual desktops, not communication</li></ul>",o:["*Amazon Chime","AWS Transfer Family","*Amazon Connect","Amazon WorkSpaces"],k:[0,2]},
{d:"svc",f:"Multi-channel messaging that also measures engagement across email, SMS, and push?",b:"<b>Amazon Pinpoint.</b><ul><li>Segmentation, campaigns, A/B testing, analytics</li><li>SNS is pub/sub with no analytics; SES is email only</li></ul>",o:["Amazon SNS","Amazon SES","*Amazon Pinpoint","Amazon SQS"],k:[2]},
{d:"svc",f:"Match each ML service: text out of scanned documents, sentiment in text, images and video, text to speech, speech to text, chatbots, custom models.",b:"<ul><li><b>Textract</b> — documents · <b>Comprehend</b> — NLP/sentiment</li><li><b>Rekognition</b> — images and video</li><li><b>Polly</b> — text to speech · <b>Transcribe</b> — speech to text</li><li><b>Lex</b> — chatbots · <b>Translate</b> — languages</li><li><b>SageMaker AI</b> — build and train your own model</li></ul>"},
{d:"svc",f:"Pull text and structured data out of scanned invoices. Which service?",b:"<b>Amazon Textract.</b><ul><li>Textract extracts text FROM documents</li><li>Comprehend finds MEANING in text you already have</li><li>Rekognition works on images and video, not documents</li></ul>",o:["Amazon Comprehend","*Amazon Textract","Amazon Rekognition","Amazon Translate"],k:[1]},
{d:"svc",f:"Polly vs. Transcribe — which direction is each?",b:"<b>Polly Produces speech (text → audio). Transcribe writes down speech (audio → text).</b><ul><li>Call recordings and captions → Transcribe</li><li>Applications that talk → Polly</li></ul>",o:["Polly turns audio into text","*Polly turns text into audio, Transcribe turns audio into text","Both convert audio to text","Both convert text to audio"],k:[1]},
{d:"svc",f:"Name the four migration stages and the service used at each.",b:"<b>Discover → Evaluate → Track → Migrate.</b><ul><li><b>Application Discovery Service</b> — inventory on-prem servers</li><li><b>Migration Evaluator</b> — business case and cost estimate</li><li><b>Migration Hub</b> — track progress</li><li><b>MGN</b> (whole servers) or <b>DMS</b> (databases)</li></ul>"},
{d:"svc",f:"Migrating Oracle to Aurora. Which two services, and when is the first one unnecessary?",b:"<b>Schema Conversion Tool + Database Migration Service.</b><ul><li>SCT is needed only when the database <b>engine changes</b></li><li>Same engine? DMS alone</li></ul>",o:["*AWS Schema Conversion Tool","AWS DataSync","*AWS Database Migration Service","AWS Application Migration Service"],k:[0,2]},
{d:"svc",f:"Which service sells your custom AMIs to other AWS customers?",b:"<b>AWS Marketplace.</b><ul><li>Marketplace = selling to the world</li><li>Service Catalog = publishing internally to your own organization</li></ul>",o:["AWS Service Catalog","*AWS Marketplace","AWS IQ","Amazon ECR"],k:[1]},
{d:"svc",f:"AppStream 2.0 vs. WorkSpaces vs. WorkSpaces Secure Browser?",b:"<ul><li><b>AppStream 2.0</b> — stream a single <b>application</b> to a browser</li><li><b>WorkSpaces</b> — a full virtual <b>desktop</b></li><li><b>Secure Browser</b> — managed browser for internal web apps</li></ul>"},
{d:"svc",f:"AWS Control Tower vs. AWS Organizations?",b:"<b>Organizations is the structure (accounts, OUs, SCPs, consolidated billing). Control Tower is the guided landing-zone setup with guardrails on top.</b>"},
{d:"svc",f:"Which ELB type can forward requests to a target group containing a Lambda function?",b:"<b>Application Load Balancer.</b><ul><li>ALB is layer 7 and supports Lambda targets</li><li>NLB is layer 4; Gateway Load Balancer is for virtual appliances</li></ul>",o:["Network Load Balancer","*Application Load Balancer","Gateway Load Balancer","Classic Load Balancer"],k:[1]},
{d:"svc",f:"Minimum number of Availability Zones for a highly available Application Load Balancer?",b:"<b>Two.</b><ul><li>An ALB requires subnets in at least two AZs</li></ul>",o:["One","*Two","Three","Six"],k:[1]},
{d:"svc",f:"Which service is AWS's own consulting arm, and who authored the Cloud Adoption Framework?",b:"<b>AWS Professional Services — they authored the CAF.</b><ul><li>APN <b>Consulting Partners</b> are third-party SIs and MSPs</li><li>Enterprise Support is a subscription, not a delivery organisation</li></ul>"},
{d:"svc",f:"Amazon OpenSearch Service — what is it for?",b:"<b>Search and log analytics.</b><ul><li>Full-text search, centralised logs, dashboards</li><li>Often receives findings from Macie or GuardDuty for deeper analysis</li><li>CloudWatch is metrics and alarms; OpenSearch is heavy log search</li></ul>"},

/* ================= CAF DEEP DIVE — 6 misses across 3 exams ================= */
{d:"cafx",f:"AWS CAF has four separate lists you must keep apart. Name all four.",b:"<ol><li><b>6 perspectives</b> — Business, People, Governance, Platform, Security, Operations</li><li><b>4 phases</b> — Envision, Align, Launch, Scale</li><li><b>4 transformation domains</b> — Technology, Process, Organization, Product</li><li><b>47 capabilities</b> distributed across the six perspectives</li></ol>Most CAF misses come from answering from the wrong list."},
{d:"cafx",f:"Which CAF phase identifies capability gaps and cross-organizational dependencies?",b:"<b>Align.</b><ul><li><b>Envision</b> — identify measurable business outcomes</li><li><b>Align</b> — gaps, dependencies, stakeholder concerns, readiness strategy</li><li><b>Launch</b> — deliver pilots in production</li><li><b>Scale</b> — expand pilots to full scale</li></ul>",o:["Envision","*Align","Launch","Scale"],k:[1]},
{d:"cafx",f:"Name the four CAF phases in order, with a one-word cue for each.",b:"<b>Envision → Align → Launch → Scale.</b><ul><li>Envision the <b>goal</b></li><li>Align the <b>organization</b> (gaps and dependencies)</li><li>Launch the <b>pilot</b></li><li>Scale it <b>up</b></li></ul>"},
{d:"cafx",f:"A company wants pilots already running in production, proving incremental value. Which CAF phase?",b:"<b>Launch.</b><ul><li>Pilots in production = Launch. Expanding them = Scale</li><li>Gaps and dependencies = Align. Outcomes = Envision</li></ul>",o:["Envision","Align","*Launch","Scale"],k:[2]},
{d:"cafx",f:"Name the four CAF transformation domains and one example of each.",b:"<ul><li><b>Technology</b> — migrate and modernise infrastructure</li><li><b>Process</b> — agile methods, automate operations, speed time to market</li><li><b>Organization</b> — restructure teams around products and value streams, culture</li><li><b>Product</b> — new digital products and revenue models</li></ul>"},
{d:"cafx",f:"A firm wants customer focus, maximum value delivery, and team collaboration. Which two CAF actions?",b:"<b>Restructure teams around products and value streams</b> (Organization) and <b>adopt agile methodologies</b> (Process).<ul><li>Migrating legacy infrastructure is <b>Technology</b> — the trap</li><li>New revenue models is <b>Product</b></li></ul>",o:["Migrate and modernise legacy infrastructure","*Restructure teams around products and value streams","Build a data and analytics platform","*Adopt agile methodologies for continuous improvement","Introduce new products and revenue models"],k:[1,3]},
{d:"cafx",f:"Where does each \"Data ___\" capability live? Data Governance, Data Curation, Data Architecture, Data Engineering, Data Protection, Data Science.",b:"<ul><li><b>Data Governance</b> → Governance</li><li><b>Data Curation</b> → Governance</li><li><b>Data Architecture</b> → Platform</li><li><b>Data Engineering</b> → Platform</li><li><b>Data Protection</b> → Security</li><li><b>Data Science</b> → Business</li></ul>AWS scatters these deliberately. This is the single most-tested CAF trick."},
{d:"cafx",f:"Which two capabilities fall under the CAF Governance perspective?",b:"<b>Data Governance and Data Curation.</b><ul><li>Data Architecture → Platform</li><li>Data Protection → Security</li><li>Data Science → Business</li></ul>",o:["Data Architecture","*Data Governance","*Data Curation","Data Protection","Data Science"],k:[1,2]},
{d:"cafx",f:"Name the capabilities of the CAF Business perspective.",b:"<ul><li>Strategy Management · Portfolio Management</li><li>Innovation Management · Product Management</li><li>Strategic Partnership</li><li><b>Data Science</b> · <b>Data Monetization</b> · Business Insights</li></ul>"},
{d:"cafx",f:"Name the capabilities of the CAF People perspective.",b:"<ul><li>Culture Evolution · Transformational Leadership</li><li>Cloud Fluency · Workforce Transformation</li><li>Change Acceleration</li><li>Organization Design · Organizational Alignment</li></ul>People = culture, skills, structure."},
{d:"cafx",f:"Name the capabilities of the CAF Governance perspective.",b:"<ul><li>Program and Project Management · Benefits Management</li><li>Risk Management · Cloud Financial Management</li><li>Application Portfolio Management</li><li><b>Data Governance</b> · <b>Data Curation</b></li></ul>"},
{d:"cafx",f:"Name the capabilities of the CAF Platform perspective.",b:"<ul><li>Platform Architecture · Platform Engineering</li><li><b>Data Architecture</b> · <b>Data Engineering</b></li><li>Provisioning and Orchestration</li><li>Modern Application Development · CI/CD</li></ul>"},
{d:"cafx",f:"Name the capabilities of the CAF Security perspective.",b:"<ul><li>Security Governance · Security Assurance</li><li><b>Identity and Access Management</b></li><li><b>Threat Detection</b> · Vulnerability Management</li><li><b>Infrastructure Protection</b> · <b>Data Protection</b></li><li>Application Security · Incident Response</li></ul>"},
{d:"cafx",f:"Name the capabilities of the CAF Operations perspective.",b:"<ul><li>Event Management (AIOps) · Incident and Problem Management</li><li>Change and Release Management</li><li>Performance and Capacity Management</li><li>Configuration Management · Patch Management</li><li>Availability and Continuity Management · Application Management</li></ul>"},
{d:"cafx",f:"Protect applications from unauthorised access and vulnerabilities in the environment. Which Security capability?",b:"<b>Infrastructure Protection.</b><ul><li><b>Protect</b> the environment → Infrastructure Protection</li><li><b>Who</b> can act → Identity and Access Management</li><li><b>Find</b> a threat → Threat Detection</li><li><b>Encrypt or classify</b> → Data Protection</li></ul>",o:["Identity and Access Management","Threat Detection","*Infrastructure Protection","Data Protection"],k:[2]},
{d:"cafx",f:"A migration must keep data and workloads confidential, intact, and available. Which CAF perspective?",b:"<b>Security.</b><ul><li>Confidentiality, integrity, availability = Security perspective</li><li>Governance is about risk and benefit realisation, not CIA</li></ul>",o:["Governance","Operations","*Security","Platform"],k:[2]},
{d:"cafx",f:"Which CAF perspective bridges technology and business and prioritises the workforce?",b:"<b>People.</b><ul><li>Culture, leadership, organisational design, cloud fluency</li></ul>",o:["Governance","*People","Operations","Business"],k:[1]},
{d:"cafx",f:"Which CAF perspective owns each: CFO, CISO, cloud architects, HR leaders, infrastructure and ops leaders?",b:"<ul><li>CFO → <b>Business</b></li><li>CISO → <b>Security</b></li><li>Cloud architects and engineers → <b>Platform</b></li><li>HR leaders → <b>People</b></li><li>Infrastructure and ops leaders → <b>Operations</b></li></ul>CIO appears in Business, People, and Governance, so it is never the distinctive answer."},
{d:"cafx",f:"Which CAF perspective orchestrates cloud initiatives, maximises benefit realisation, and minimises transformation risk?",b:"<b>Governance.</b><ul><li>Prioritise, measure, manage risk</li><li>Business is about outcomes; Governance is about how you steer toward them</li></ul>",o:["Business","*Governance","Operations","Platform"],k:[1]},
{d:"cafx",f:"Which CAF perspective ensures cloud services are delivered at the level the business needs?",b:"<b>Operations.</b><ul><li>Event, incident, change, patch, availability management</li><li>Platform builds it; Operations runs it</li></ul>",o:["Platform","*Operations","Governance","People"],k:[1]},
{d:"cafx",f:"Which perspective owns Cloud Financial Management as a capability?",b:"<b>Governance.</b><ul><li>Easy to guess Business because it involves money</li><li>Governance owns the discipline of planning, measuring, and optimising spend</li></ul>",o:["Business","*Governance","Operations","Platform"],k:[1]},
{d:"cafx",f:"Which perspective owns CI/CD and modern application development?",b:"<b>Platform.</b><ul><li>Platform = build and deliver the environment and the applications on it</li><li>Operations = run what has been built</li></ul>",o:["*Platform","Operations","Governance","Business"],k:[0]},

/* ================= LOAD BALANCERS ================= */
{d:"elb",f:"What do OSI \"layers\" actually mean for a load balancer? Explain layer 4 vs layer 7 without jargon.",b:"<b>Layer 4 reads the envelope. Layer 7 opens the letter.</b><ul><li><b>Layer 4</b> sees only IP address and port number. It can forward fast, but has no idea what the request is asking for</li><li><b>Layer 7</b> understands HTTP, so it can read the URL path, the Host header, and cookies — and route on them</li><li><b>Layer 3</b> is raw IP packets, below even ports</li></ul>"},
{d:"elb",f:"Name the three Elastic Load Balancer types, their layer, and the one sentence that picks each.",b:"<ul><li><b>Application Load Balancer</b> — <b>Layer 7</b>. Anything about the <i>content</i> of the request</li><li><b>Network Load Balancer</b> — <b>Layer 4</b>. Anything about <i>raw speed and volume</i></li><li><b>Gateway Load Balancer</b> — <b>Layer 3/4</b>. Sending traffic through a <i>third-party appliance</i></li></ul>"},
{d:"elb",f:"Which load balancer supports path-based routing, host-based routing, and WebSockets?",b:"<b>Application Load Balancer.</b><ul><li>Path (/api vs /images), Host header, HTTP headers, query strings</li><li>NLB cannot do any content-based routing — it never reads the HTTP request</li></ul>",o:["*Application Load Balancer","Network Load Balancer","Gateway Load Balancer","Both ALB and NLB"],k:[0]},
{d:"elb",f:"Which load balancer can forward requests to a target group containing a Lambda function?",b:"<b>Application Load Balancer.</b><ul><li>ALB converts the HTTP request into a JSON payload and invokes the function</li><li>Only a Layer 7 balancer understands HTTP well enough to do this</li></ul>",o:["Network Load Balancer","*Application Load Balancer","Gateway Load Balancer","Both Gateway and Network Load Balancer"],k:[1]},
{d:"elb",f:"List the four target types an Application Load Balancer supports.",b:"<b>EC2 instances · IP addresses · Lambda functions · another Application Load Balancer.</b><ul><li>Lambda as a target is ALB-only</li></ul>"},
{d:"elb",f:"When is a Network Load Balancer the right choice?",b:"<b>Extreme performance, millions of requests per second, ultra-low latency, static IP per AZ, or non-HTTP protocols.</b><ul><li>TCP, UDP, TLS</li><li>Preserves the client source IP</li><li>Gaming, IoT, and financial workloads</li></ul>"},
{d:"elb",f:"What is a Gateway Load Balancer for?",b:"<b>Deploying and scaling third-party virtual appliances</b> — firewalls, intrusion detection, deep packet inspection.<ul><li>A transparent bump-in-the-wire; traffic passes through the appliance and continues</li><li>Uses the GENEVE protocol on port 6081</li></ul>"},
{d:"elb",f:"Users cannot reach one EC2 web server behind an ALB. What do you check first?",b:"<b>The ELB health check.</b><ul><li>A load balancer routes only to targets that pass their health check</li><li>Visible directly in the ELB console under target group health</li><li>CloudWatch and CloudTrail are for investigation after, not first</li></ul>",o:["Amazon CloudWatch","AWS CloudTrail","*ELB health check","AWS Config"],k:[2]},
{d:"elb",f:"Minimum number of Availability Zones for a highly available Application Load Balancer?",b:"<b>Two.</b><ul><li>An ALB needs a subnet in at least two AZs</li><li>Cross-zone load balancing is on by default for ALB</li></ul>",o:["One","*Two","Three","Six"],k:[1]},
{d:"elb",f:"Which load balancer preserves the original client IP address without extra headers?",b:"<b>Network Load Balancer.</b><ul><li>ALB replaces the source IP and passes the original in the X-Forwarded-For header</li><li>NLB passes the client IP straight through</li></ul>"},
{d:"elb",f:"An application needs to route /api to one target group and /images to another. Which balancer, and what is this feature called?",b:"<b>Application Load Balancer, using path-based routing.</b><ul><li>Host-based routing does the same on the domain name instead</li></ul>",o:["Network Load Balancer with port routing","*Application Load Balancer with path-based routing","Gateway Load Balancer with rule routing","Route 53 weighted routing"],k:[1]},
{d:"elb",f:"Which two things does Elastic Load Balancing do that a security group does not?",b:"<b>Distribute traffic across targets, and health-check them.</b><ul><li>A load balancer moves traffic; it does not filter it</li><li>Filtering is a security group (instance) or NACL (subnet)</li></ul>"},
{d:"elb",f:"Which services actually secure a VPC network?",b:"<b>Security groups and network ACLs.</b><ul><li>ALB distributes traffic, it does not filter</li><li>CloudFront is a CDN; IAM controls API permissions, not packets</li></ul>",o:["*Network ACL","*Security group","Application Load Balancer","Amazon CloudFront","AWS IAM"],k:[0,1]},

/* ================= REPEAT MISSES ACROSS SETS 1-3 ================= */
{d:"rep",f:"Name the four classic cloud best practices, and say which one covers multi-threading S3 requests.",b:"<b>Design for failure · Decouple your components · Implement elasticity · Think parallel.</b><ul><li>Multi-threaded Multipart Upload = <b>Think parallel</b></li><li>SOA and SQS = <b>Decouple</b></li></ul>You have missed one from this list on two consecutive exams."},
{d:"rep",f:"Multi-threading S3 requests through the Multipart Upload API is an example of which cloud best practice?",b:"<b>Think parallel.</b><ul><li>Nothing is being separated, so it is not decoupling</li><li>Nothing scales with demand, so it is not elasticity</li><li>\"Allow for evolutionary architectures\" is a Well-Architected <i>general design principle</i>, a different list</li></ul>",o:["Allow for evolutionary architectures","Implement elasticity","Decouple your components","*Think parallel"],k:[3]},
{d:"rep",f:"Which cloud best practice reinforces service-oriented architecture?",b:"<b>Decouple your components.</b><ul><li>Loosely coupled components fail independently and scale independently</li><li>Implemented with SQS as a buffer, service interfaces, async interaction, and stateless applications</li></ul>",o:["*Decouple your components","Think parallel","Implement elasticity","Design for failure"],k:[0]},
{d:"rep",f:"Which two practices demonstrate operational excellence?",b:"<b>Deploy small incremental changes (CodeDeploy) and run regular game days.</b><ul><li>Using Lambda is <b>performance efficiency</b>, not OpEx</li><li>Right-sizing an instance is <b>performance efficiency</b></li><li>Launching manually via the console is the opposite of OpEx</li></ul>",o:["Launch infrastructure manually via the console","Use serverless applications such as Lambda","*Deploy small incremental changes with CodeDeploy","*Perform monthly game days","Monitor EC2 metrics and change instance type"],k:[2,3]},

const KEY='clfc02_final_v1';
const store={
 async get(){try{if(window.storage){const r=await window.storage.get(KEY);return r?JSON.parse(r.value):null}}catch(e){}
  try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){}return null},
 async set(o){const s=JSON.stringify(o);
  try{if(window.storage){await window.storage.set(KEY,s);return}}catch(e){}
  try{localStorage.setItem(KEY,s)}catch(e){}},
 async clear(){try{if(window.storage){await window.storage.delete(KEY);return}}catch(e){}
  try{localStorage.removeItem(KEY)}catch(e){}}
};

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function fmt(t){if(!t)return'';if(/<[a-z/]/i.test(t))return t;
 const L=t.split(/\r?\n/);let o='',u=false;
 L.forEach(l=>{const b=l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  if(/^\s*[-*]\s+/.test(l)){if(!u){o+='<ul>';u=true}o+='<li>'+b.replace(/^\s*[-*]\s+/,'')+'</li>'}
  else{if(u){o+='</ul>';u=false}if(b.trim())o+='<div>'+b+'</div>'}});
 return u?o+'</ul>':o}
function plain(h){if(!h)return'';return h.replace(/<\/li>/g,'\n').replace(/<li>/g,'- ')
 .replace(/<\/?ul>/g,'\n').replace(/<\/div>/g,'\n').replace(/<div>/g,'').replace(/<br\s*\/?>/g,'\n')
 .replace(/<b>(.*?)<\/b>/g,'**$1**').replace(/<\/?i>/g,'').replace(/<[^>]+>/g,'')
 .replace(/\n{3,}/g,'\n\n').trim()}

function buildOrder(shuffle){
 const ks=Object.keys(sel).filter(k=>sel[k]);
 order=LIVE.filter(c=>ks.indexOf(c.d)>=0).map(c=>c.id);
 if(shuffle)for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));
  [order[i],order[j]]=[order[j],order[i]]}
 idx=0;flipped=false;picked={};rated={};seen={};reps=0;started=Date.now();
}
