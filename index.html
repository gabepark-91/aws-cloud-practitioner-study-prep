   <button class="ib" onclick="openC=null;view='browse';render()">&#9776;</button>
   <button class="ib" onclick="view='summary';render()">&#9673;</button>
 </div>
 <div class="segs"><div class="sw">${segs}</div><div class="segn">${idx+1} / ${order.length}</div></div>
 <main>
  <div class="card" ${flipped||hasMC?'':'onclick="flip()"'}>
   <div class="meta">
     <span class="chip">${DN[c.d]}</span>
     ${hasMC?`<span class="chip g">${need>1?'select '+need:'multiple choice'}</span>`:''}
     ${c.edited?'<span class="chip w">edited</span>':''}
     ${flags[c.id]?'<span class="chip w">flagged</span>':''}
     <span class="chip g">deck ${deck.findIndex(x=>x.id===c.id)+1} of ${deck.length}</span>
   </div>
   <div class="mid">
     <div class="front ${c.f.length>115?'sm':''}">${fmt(c.f)}</div>
     ${hasMC?`<div class="mcq">${need>1?`<div class="pick2">Choose ${need} — judge each option on its own</div>`:''}
      ${c.o.map((o,n)=>{let cl='mco';
        if(flipped){if(c.k.indexOf(n)>=0)cl='mco ok';else if(p.indexOf(n)>=0)cl='mco no'}
        else if(p.indexOf(n)>=0)cl='mco sel';
        const mk=flipped?(c.k.indexOf(n)>=0?'&#10003;':(p.indexOf(n)>=0?'&#10007;':'')):String.fromCharCode(65+n);
        return `<div class="${cl}" ${flipped?'':`onclick="pick(${n})"`}><div class="mk">${mk}</div><div>${esc(o)}</div></div>`
       }).join('')}</div>`:''}
     ${flipped?`<div class="rule"></div>${vd}<div class="back">${fmt(c.b)}</div>`
       :(hasMC?'':`<div class="hint">Tap to reveal</div>`)}
   </div>
   <div class="shuf" onclick="event.stopPropagation();go(true)">&#8646;</div>
  </div>
 </main>
 <div class="foot">
   <div class="navrow">
     <button class="nav" onclick="step(-1)" ${idx===0?'disabled':''}>&#8249;</button>
     <div class="navn">${idx+1} of ${order.length}</div>
     <button class="nav" onclick="step(1)" ${idx>=order.length-1?'disabled':''}>&#8250;</button>
   </div>
   ${flipped&&track?`<div class="rates">
     <button class="r1" onclick="rate('again')">Again<span class="sub">no idea</span></button>
     <button class="r2" onclick="rate('good')">Good<span class="sub">got there</span></button>
     <button class="r3" onclick="rate('easy')">Easy<span class="sub">instant</span></button>
   </div>`:`<button class="big" onclick="flip()" ${ready||flipped?'':'disabled'}>
     ${flipped?'Next card':(hasMC?(ready?'Check answer':'Choose '+(need-p.length)+' more'):'Show answer')}</button>`}
   <div class="tog" onclick="track=!track;save();render()">
     <span>Track learning</span><div class="sw2 ${track?'on':''}"><i></i></div></div>
 </div>`;
}
function flip(){const c=cur();if(flipped){step(1);return}flipped=true;seen[c.id]=true;reps++;save();render()}
function pick(n){const c=cur(),need=c.k.length;let p=picked[c.id]||[];
 if(need>1){const i=p.indexOf(n);if(i>=0)p.splice(i,1);else p.push(n);if(p.length>need)p=p.slice(-need)}
 else p=[n];
 picked[c.id]=p;save();render()}
function step(d){idx=Math.min(order.length-1,Math.max(0,idx+d));flipped=false;save();render()}
function rate(k){const c=cur();rated[c.id]=k;
 if(idx>=order.length-1){view='summary';save();return render()}
 step(1)}
function flag(){const c=cur();flags[c.id]=!flags[c.id];save();render()}

function summary(){
 const done=Object.keys(rated).length,tot=order.length;
 const e=Object.values(rated).filter(v=>v==='easy').length;
 const g=Object.values(rated).filter(v=>v==='good').length;
 const a=Object.values(rated).filter(v=>v==='again').length;
 const fl=order.filter(id=>flags[id]).length;
 let mcT=0,mcR=0;
 order.forEach(id=>{const c=BYID[id];if(c&&c.o&&picked[id]&&picked[id].length===c.k.length){mcT++;
  if(picked[id].every(x=>c.k.indexOf(x)>=0))mcR++}});
 const mins=started?Math.max(1,Math.round((Date.now()-started)/60000)):0;
 const byDeck=DECKS.map(d=>{const ids=order.filter(id=>BYID[id]&&BYID[id].d===d.k);
   if(!ids.length)return null;const r=ids.filter(id=>rated[id]==='easy'||rated[id]==='good').length;
   return {n:d.n,r,t:ids.length}}).filter(Boolean);
 app.innerHTML=`
 <div class="hdr"><button class="ib" onclick="view='study';render()">&#9664;</button>
  <div class="ttl">Session summary</div>
  <button class="ib" onclick="view='home';render()">&#8962;</button></div>
 <div class="scroll">
  <div class="sum" style="padding-top:14px">
   <div class="pct" style="color:var(--ok)">${tot?Math.round((e+g)/tot*100):0}%</div>
   <h2>${e+g} of ${tot} confident</h2>
   <p>${done} rated &middot; ${reps} cards viewed &middot; about ${mins} minute${mins===1?'':'s'}
   ${mcT?`<br>${mcR} of ${mcT} multiple choice correct`:''}</p>
  </div>
  <div class="pnl"><h2 style="margin-bottom:12px">By deck</h2>
   <div class="bars">${byDeck.map(d=>{const p=Math.round(d.r/d.t*100);
     const col=p>=70?'var(--ok)':(p>=40?'var(--warn)':'var(--no)');
     return `<div class="bar"><div class="lb"><span>${d.n}</span><span class="v">${d.r}/${d.t}</span></div>
     <div class="tr"><i style="width:${p}%;background:${col}"></i></div></div>`}).join('')}</div>
  </div>
  <div class="pnl"><h2 style="margin-bottom:12px">Ratings</h2>
   <div class="bars">
    <div class="bar"><div class="lb"><span style="color:var(--no)">Again</span><span class="v">${a}</span></div>
     <div class="tr"><i style="width:${tot?a/tot*100:0}%;background:var(--no)"></i></div></div>
    <div class="bar"><div class="lb"><span style="color:var(--acc)">Good</span><span class="v">${g}</span></div>
     <div class="tr"><i style="width:${tot?g/tot*100:0}%;background:var(--acc)"></i></div></div>
    <div class="bar"><div class="lb"><span style="color:var(--ok)">Easy</span><span class="v">${e}</span></div>
     <div class="tr"><i style="width:${tot?e/tot*100:0}%;background:var(--ok)"></i></div></div>
   </div>
   <p style="margin:0">${fl} card${fl===1?'':'s'} flagged for another look.</p>
  </div>
  ${a||fl?`<button class="big" onclick="redo()">Redo the weak ones (${new Set(order.filter(id=>rated[id]==='again'||flags[id])).size})</button><div style="height:10px"></div>`:''}
  <button class="ghost" onclick="go(true);">Reshuffle and restart</button>
  <button class="ghost" onclick="view='home';render()">Choose different decks</button>
 </div>`;
}
function redo(){
 const weak=order.filter(id=>rated[id]==='again'||flags[id]);
 if(!weak.length)return;
 order=weak.slice();idx=0;flipped=false;picked={};rated={};seen={};reps=0;started=Date.now();
 view='study';save();render();
}

function browse(){
 const ks=Object.keys(sel).some(k=>sel[k])?Object.keys(sel).filter(k=>sel[k]):DECKS.map(d=>d.k);
 let h='';
 DECKS.filter(d=>ks.indexOf(d.k)>=0).forEach(d=>{
  const it=LIVE.filter(c=>c.d===d.k);if(!it.length)return;
  h+=`<div class="sec">${d.n} &middot; ${it.length}</div>`;
  it.forEach(c=>{const op=openC===c.id,pos=order.indexOf(c.id);
   h+=`<div class="item" onclick="openC=${op?'null':"'"+c.id+"'"};render()">
    <div class="t">${DN[c.d]}${c.edited?' &middot; edited':''}<span class="st">${flags[c.id]?'&#9733; ':''}${rated[c.id]?rated[c.id]:(pos>=0?'#'+(pos+1):'')}</span></div>
    <div class="f">${fmt(c.f)}</div>
    ${op?`${c.o?'<div class="b">'+c.o.map((o,n)=>'<div style="margin:4px 0">'+((c.k||[]).indexOf(n)>=0?'<b>&#10003; '+esc(o)+'</b>':'&#9675; '+esc(o))+'</div>').join('')+'</div>':''}
     <div class="b">${fmt(c.b)}</div>
     <div class="lk" onclick="event.stopPropagation();editCard('${c.id}')">Edit</div>
     ${pos>=0?`<div class="lk" onclick="event.stopPropagation();jump(${pos})">Go to this card &rarr;</div>`:''}`:''}
   </div>`})});
 app.innerHTML=`<div class="hdr">
  <button class="ib" onclick="view=order.length?'study':'home';render()">&#9664;</button>
  <div class="ttl">Browse &amp; edit</div>
  <button class="ib" onclick="newCard()">&#43;</button>
  <button class="ib" onclick="view='home';render()">&#8962;</button></div>
  <div class="scroll">${h||'<div class="pnl"><p>No cards.</p></div>'}</div>`;
}
function jump(p){idx=p;flipped=false;openC=null;view='study';save();render()}

function editCard(id){editId=id;editNew=false;view='edit';render()}
function newCard(){const id='u'+Date.now();extra.push({id,d:'mine',f:'',b:''});build();sel['mine']=true;
 editId=id;editNew=true;view='edit';save();render()}
function optT(c){if(!c.o||!c.o.length)return'';return c.o.map((o,n)=>((c.k||[]).indexOf(n)>=0?'*':'')+o).join('\n')}
function editor(){
 const c=BYID[editId];if(!c){view='home';return render()}
 app.innerHTML=`<div class="hdr"><button class="ib" onclick="cancelEdit()">&#9664;</button>
  <div class="ttl">${editNew?'New card':'Edit card'}</div><div style="width:38px"></div></div>
 <div class="scroll"><div class="pnl ed">
  <div class="row"><label>Deck</label>
   <select id="eD">${DECKS.map(d=>`<option value="${d.k}" ${c.d===d.k?'selected':''}>${d.n}</option>`).join('')}</select></div>
  <div class="row"><label>Question</label>
   <textarea class="f" id="eF">${esc(plain(c.f))}</textarea></div>
  <div class="row"><label>Answer choices — optional</label>
   <textarea class="f" id="eO" placeholder="Leave blank for a flip card.&#10;One per line, * marks correct.">${esc(optT(c))}</textarea>
   <p class="tip">Mark two lines with <b>*</b> to make it Select TWO.</p></div>
  <div class="row" style="margin-bottom:4px"><label>Answer</label>
   <textarea class="b" id="eB">${esc(plain(c.b))}</textarea>
   <p class="tip">Line starting with <b>-</b> makes a bullet. <b>**stars**</b> makes bold.</p></div>
 </div>
 <div class="ebar"><button onclick="cancelEdit()">Cancel</button><button class="pri" onclick="saveEdit()">Save</button></div>
 <div class="ebar">${ed[editId]?'<button onclick="revert()">Restore original</button>':''}
  <button class="dan" onclick="delCard()">Delete card</button></div>
 <div class="pnl"><div class="f" style="font-size:16px;font-weight:650">${fmt(c.f)||'Preview'}</div>
  <div class="b" style="margin-top:11px;padding-top:11px;border-top:1px solid var(--rule)">${fmt(c.b)||''}</div></div>
 </div>`;
 if(editNew)document.getElementById('eF').focus();
}
function saveEdit(){
 const f=document.getElementById('eF').value.trim(),b=document.getElementById('eB').value.trim(),
       d=document.getElementById('eD').value,ot=document.getElementById('eO').value.trim();
 if(!f){alert('The question cannot be empty.');return}
 let o=[],k=[];
 if(ot){const L=ot.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  o=L.map(s=>s.replace(/^\*\s*/,''));k=L.map((s,n)=>s.charAt(0)==='*'?n:-1).filter(n=>n>=0);
  if(o.length<2){alert('Give at least two choices, or leave the box empty.');return}
  if(!k.length){alert('Mark at least one correct choice with *');return}}
 const pay={f,b,d,o,k};
 if(editId.charAt(0)==='u')Object.assign(extra.find(x=>x.id===editId),pay);else ed[editId]=pay;
 build();editNew=false;save();view=order.indexOf(editId)>=0?'study':'browse';flipped=false;render();
}
function cancelEdit(){if(editNew){extra=extra.filter(x=>x.id!==editId);build();editNew=false;save()}
 view=order.length?'study':'home';render()}
function revert(){if(!confirm('Restore the original wording?'))return;delete ed[editId];build();save();
 view=order.indexOf(editId)>=0?'study':'browse';render()}
function delCard(){if(!confirm('Remove this card?'))return;
 if(editId.charAt(0)==='u')extra=extra.filter(x=>x.id!==editId);else del[editId]=true;
 delete ed[editId];order=order.filter(id=>id!==editId);build();save();
 view=order.length?'study':'home';flipped=false;render()}

function gloss(){app.innerHTML=`<div class="hdr">
 <button class="ib" onclick="view=order.length?'study':'home';render()">&#9664;</button>
 <div class="ttl">Acronyms &middot; ${GLOSS.length}</div>
 <button class="ib" onclick="view='home';render()">&#8962;</button></div>
 <div class="scroll">${GLOSS.map(g=>`<div class="gl"><div class="ab">${g[0]}</div><div class="ex">${g[1]}</div></div>`).join('')}</div>`}

function backup(){app.innerHTML=`<div class="hdr">
 <button class="ib" onclick="view='home';render()">&#9664;</button><div class="ttl">Back up edits</div>
 <div style="width:38px"></div></div>
 <div class="scroll"><div class="pnl ed"><div class="row"><label>Copy this somewhere safe</label>
 <textarea class="b" id="bT">${esc(JSON.stringify({ed,del,extra}))}</textarea>
 <p class="tip">Paste it back and tap Restore if the app file is replaced or you switch devices.</p></div></div>
 <div class="ebar"><button onclick="view='home';render()">Done</button>
 <button class="pri" onclick="restore()">Restore</button></div></div>`}
function restore(){try{const o=JSON.parse(document.getElementById('bT').value);
 ed=o.ed||{};del=o.del||{};extra=o.extra||[];build();save();alert('Restored.');view='home';render()}
 catch(e){alert('That is not valid backup text.')}}

(async()=>{const s=await store.get();
 if(s){sel=s.sel||{};order=s.order||[];idx=s.idx||0;flags=s.flags||{};rated=s.rated||{};
  track=s.track!==false;ed=s.ed||{};del=s.del||{};extra=s.extra||[];seen=s.seen||{};
  reps=s.reps||0;started=s.started||null}
 build();
 if(!Object.keys(sel).length)DECKS.forEach(d=>{if(d.k!=='mine')sel[d.k]=true});
 view='home';render()})();
</script>
</body>
</html>
